server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: gramdrishti-backend
  profiles:
    active: dev

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:gramdrishtidb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: ${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 2000ms

# App Specific Configurations
app:
  jwt:
    secret: "404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970"
    expiration-ms: 3600000        # 1 hour
    refresh-expiration-ms: 604800000 # 7 days
    cookie-name: "gramdrishti_refresh_token"
  
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://127.0.0.1:5173}

  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${MINIO_BUCKET_NAME:gramdrishti-assets}
    expiry-seconds: 3600

  ai-service:
    url: ${AI_SERVICE_URL:http://localhost:8000}

  rate-limit:
    enabled: true
    max-requests-per-minute: 120

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
